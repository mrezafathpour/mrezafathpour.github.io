<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="theme-color"
            content="#eeeef4"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#14110F"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
        <title>You're offline · &lt;/ MR &gt;</title>
        <!--
            Shown by the service worker (service-worker.js) when the app is
            opened without a connection. An app that is already open stays as
            it is when the connection drops. It is cached together with the
            two files it needs, its icon and mr-logo.js (the "MR" logo and its
            animations, shared with the page loader in index.html).
        -->
        <style>
            :root {
                color-scheme: light dark;
                /* Same accent as the app's theme in src/index.css */
                --accent: #ff6b35;
                --accent-light: #ff9f6e;
                --accent-text: var(--accent);
                --bg: #eeeef4;
                --text: #14110F;
                --muted: rgba(26, 26, 26, 0.6);
                --surface: rgba(255, 255, 255, 0.55);
                --border: rgba(15, 23, 42, 0.1);
                --logo-ink: #14110f;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --accent-text: var(--accent-light);
                    --bg: #14110F;
                    --text: #eeeef4;
                    --muted: rgba(238, 238, 244, 0.6);
                    --surface: rgba(255, 255, 255, 0.06);
                    --border: rgba(255, 255, 255, 0.14);
                }
            }

            * {
                box-sizing: border-box;
            }

            /* At least the screen's height, so the content is centred, but
               free to grow and scroll when it does not fit (a phone turned
               sideways) */
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 2rem 1rem;
                overflow-x: hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, "Helvetica Neue", sans-serif;
                -webkit-font-smoothing: antialiased;
                color: var(--text);
                background: var(--bg);
            }

            /* ---------- Drifting glow in the background ---------- */

            .glow {
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
            }

            .glow span {
                position: absolute;
                width: 46vmax;
                height: 46vmax;
                border-radius: 50%;
                filter: blur(9vmax);
                opacity: 0.35;
                animation: drift 18s ease-in-out infinite alternate;
            }

            .glow span:nth-child(1) {
                top: -18vmax;
                left: -12vmax;
                background: var(--accent);
            }

            .glow span:nth-child(2) {
                right: -16vmax;
                bottom: -20vmax;
                background: var(--accent-light);
                animation-duration: 22s;
                animation-delay: -6s;
            }

            .glow span:nth-child(3) {
                top: 40%;
                left: 55%;
                width: 26vmax;
                height: 26vmax;
                background: var(--accent);
                opacity: 0.18;
                animation-duration: 26s;
                animation-delay: -12s;
            }

            @media (prefers-color-scheme: dark) {
                .glow span {
                    opacity: 0.2;
                }
            }

            @keyframes drift {
                to {
                    transform: translate(12vmax, 10vmax) scale(1.15);
                }
            }

            /* ---------- Card ---------- */

            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.25rem;
                width: min(100%, 26rem);
                text-align: center;
            }

            /* ---------- Logo: its letters drop into place (mr-logo.js),
               and while a connection is checked they keep falling out as
               new ones drop in ---------- */

            .logo-wrap {
                --logo-size: 8rem;
                display: grid;
                place-items: center;
                width: calc(var(--logo-size) * 1.375);
                height: calc(var(--logo-size) * 1.375);
                margin-bottom: 0.5rem;
            }

            /* The logo and its ripples share one grid cell, centred */
            .logo-wrap > * {
                grid-area: 1 / 1;
            }

            /* Ripples searching for a connection: the tile's own outline,
               corners included (icons/favicon.svg rounds them by 3 of its 16
               units), growing outwards */
            .ripple {
                width: var(--logo-size);
                height: var(--logo-size);
                border: 2px solid var(--accent);
                border-radius: calc(3 / 16 * 100%);
                opacity: 0;
                animation: ripple 3s ease-out infinite;
                animation-delay: 1.6s;
            }

            .ripple:nth-of-type(2) {
                animation-delay: 2.6s;
            }

            .ripple:nth-of-type(3) {
                animation-delay: 3.6s;
            }

            @keyframes ripple {
                0% {
                    opacity: 0.55;
                    transform: scale(0.85);
                }
                100% {
                    opacity: 0;
                    transform: scale(1.6);
                }
            }

            .logo {
                width: var(--logo-size);
                height: var(--logo-size);
                animation: tile-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }

            .logo .mr-logo-tile {
                filter: drop-shadow(0 0.6px 1.2px rgba(255, 107, 53, 0.45));
            }

            @keyframes tile-in {
                from {
                    opacity: 0;
                    transform: scale(0.6) rotate(-8deg);
                }
            }

            /* ---------- Text ---------- */

            .reveal {
                animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(0.75rem);
                }
            }

            .status {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.375rem 0.875rem;
                border: 1px solid var(--border);
                border-radius: 999px;
                font-size: 0.8125rem;
                font-weight: 600;
                letter-spacing: 0.04em;
                background: var(--surface);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                animation-delay: 0.9s;
            }

            .status-dot {
                position: relative;
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 50%;
                background: var(--accent);
                transition: background 0.3s ease;
            }

            .status-dot::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: 50%;
                background: inherit;
                animation: ping 1.6s ease-out infinite;
            }

            @keyframes ping {
                to {
                    opacity: 0;
                    transform: scale(2.8);
                }
            }

            .is-online .status-dot {
                background: #22c55e;
            }

            h1 {
                margin: 0;
                font-size: clamp(1.75rem, 7vw, 2.25rem);
                font-weight: 700;
                letter-spacing: -0.01em;
                animation-delay: 1s;
            }

            .code {
                margin: -0.25rem 0 0;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
                    monospace;
                font-size: 0.9375rem;
                font-weight: 600;
                color: var(--accent-text);
                animation-delay: 1.1s;
            }

            .caret {
                display: inline-block;
                width: 0.55em;
                height: 1.1em;
                margin-left: 0.15em;
                vertical-align: -0.2em;
                background: currentColor;
                animation: blink 1s steps(1) infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }

            .message {
                margin: 0;
                max-width: 22rem;
                font-size: 1rem;
                line-height: 1.5;
                color: var(--muted);
                animation-delay: 1.2s;
            }

            button {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                margin-top: 0.5rem;
                padding: 0.75rem 1.5rem;
                border: 0;
                border-radius: 999px;
                font: inherit;
                font-weight: 600;
                color: #fff;
                background: var(--accent);
                box-shadow: 0 10px 28px -10px var(--accent);
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                animation-delay: 1.3s;
            }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 14px 32px -10px var(--accent);
            }

            button:active {
                transform: scale(0.97);
            }

            button:focus-visible {
                outline: 3px solid var(--accent-light);
                outline-offset: 3px;
            }

            button svg {
                width: 1.1em;
                height: 1.1em;
            }

            .is-checking button {
                cursor: progress;
            }

            .is-checking button svg {
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* Tried again, still no connection */
            .is-failed .status {
                animation: shake 0.45s ease;
            }

            @keyframes shake {
                20%,
                60% {
                    transform: translateX(-6px);
                }
                40%,
                80% {
                    transform: translateX(6px);
                }
            }

            /* Short screens (a phone turned sideways): everything tighter,
               so most of it fits without scrolling */
            @media (max-height: 560px) {
                body {
                    padding: 1.25rem 1rem;
                }

                main {
                    gap: 0.75rem;
                }

                .logo-wrap {
                    --logo-size: 4.5rem;
                    margin-bottom: 0;
                }

                h1 {
                    font-size: 1.5rem;
                }

                .message {
                    font-size: 0.9375rem;
                }

                button {
                    margin-top: 0;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="glow" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <main>
            <div class="logo-wrap" aria-hidden="true">
                <span class="ripple"></span>
                <span class="ripple"></span>
                <span class="ripple"></span>
                <div class="logo" id="logo"></div>
            </div>

            <span class="status reveal" role="status" aria-live="polite">
                <span class="status-dot"></span>
                <span id="status-text">No connection</span>
            </span>

            <h1 class="reveal">You're offline</h1>
            <p class="code reveal">
                &lt;/ connection lost &gt;<span class="caret"></span>
            </p>
            <p class="message reveal">
                Check your internet connection, then tap Try again.
            </p>

            <button type="button" id="retry" class="reveal">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <path d="M21 3v6h-6" />
                </svg>
                Try again
            </button>
        </main>

        <script src="mr-logo.js"></script>
        <script>
            // The "MR" logo (mr-logo.js): its letters drop into place once.
            // Without it, the page still works, just without its letters.
            var logo = window.MRLogo
                ? window.MRLogo.create(document.getElementById("logo"))
                : {
                      fill: function () {},
                      loop: function () {},
                      stop: function (done) {
                          done();
                      },
                  };

            // As the tile pops in (see .logo)
            logo.fill(450);

            // ---------- Reconnecting ----------
            // Only when "Try again" is tapped: the page never checks on its
            // own

            var statusText = document.getElementById("status-text");
            var retry = document.getElementById("retry");
            var checking = false;
            var reloading = false;

            var reconnect = function () {
                reloading = true;

                document.body.classList.add("is-online");
                statusText.textContent = "Back online, reloading…";
                setTimeout(function () {
                    // Opened directly, this page would just reload itself
                    if (/offline\.html$/.test(location.pathname)) {
                        location.replace("./");
                    } else {
                        location.reload();
                    }
                }, 900);
            };

            // A real request, since navigator.onLine can claim a connection
            // that does not actually reach the site. Until it answers, the
            // letters keep falling out as new ones drop in; once it has, the
            // swap under way finishes before the answer shows (so even an
            // instant answer shows one full swap).
            var check = function () {
                if (checking || reloading) return;
                checking = true;

                var body = document.body;
                body.classList.remove("is-failed");
                body.classList.add("is-checking");
                statusText.textContent = "Checking…";
                logo.loop();

                var settle = function (isOnline) {
                    logo.stop(function () {
                        checking = false;
                        body.classList.remove("is-checking");

                        if (isOnline) {
                            reconnect();
                            return;
                        }

                        statusText.textContent = "Still offline";
                        // Restarts the shake even on taps in quick succession
                        void body.offsetWidth;
                        body.classList.add("is-failed");
                    });
                };

                fetch(location.href, { cache: "no-store" })
                    .then(function (response) {
                        settle(response.ok);
                    })
                    .catch(function () {
                        settle(false);
                    });
            };

            retry.addEventListener("click", check);
        </script>
    </body>
</html>
